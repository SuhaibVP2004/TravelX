<section class="section"><div class="container"><div class="cgrid">
 <div><div class="title" style="text-align:left;margin-bottom:24px"><span>Get in touch</span><h2>Let's plan your trip</h2></div>
 <ul class="info">
  <li><i class="ic fa-solid fa-location-dot"></i><div><b>Office</b><br>MG Road, Kochi, Kerala 682016, India</div></li>
  <li><i class="ic fa-solid fa-phone"></i><div><b>Phone</b><br><a href="tel:+918943103140">+91 89431 03140</a></div></li>
  <li><i class="ic fa-solid fa-envelope"></i><div><b>Email</b><br><a href="mailto:heytravelx@gmail.com">heytravelx@gmail.com</a></div></li>
  <li><i class="ic fa-solid fa-clock"></i><div><b>Hours</b><br>Mon–Sat, 9:00 AM – 6:00 PM</div></li></ul>
 <b>Follow us</b><div class="social" style="--x:0"><a href="https://facebook.com" target="_blank" rel="noopener" aria-label="facebook-f"><i class="fa-brands fa-facebook-f"></i></a><a href="https://www.instagram.com/shuh4ibb_" target="_blank" rel="noopener" aria-label="instagram"><i class="fa-brands fa-instagram"></i></a><a href="https://x.com" target="_blank" rel="noopener" aria-label="x-twitter"><i class="fa-brands fa-x-twitter"></i></a><a href="https://youtube.com" target="_blank" rel="noopener" aria-label="youtube"><i class="fa-brands fa-youtube"></i></a></div></div>
 <form id="contact-form" class="card" style="padding:30px" novalidate>
  <div class="fld"><input name="name" placeholder="Full name" aria-label="Full name"><span class="err"></span></div>

  <div class="fld"><input name="subject" placeholder="Subject" aria-label="Subject"><span class="err"></span></div>
  <div class="fld"><textarea name="message" rows="5" placeholder="Tell us about your trip" aria-label="Message"></textarea><span class="err"></span></div>
  <button class="btn pri" type="submit">Send Message</button><p class="ok" role="status"></p></form></div>
 <iframe class="map" title="TravelX office location" loading="lazy" src="https://www.google.com/maps?q=MG+Road,+Kochi,+Kerala&amp;output=embed"></iframe></div></section>
